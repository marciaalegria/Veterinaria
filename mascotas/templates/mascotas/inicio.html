{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Inicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-image: linear-gradient(rgba(255, 255, 255, 0.40),
                rgba(255, 255, 255, 0.40)),
            url("{% static 'mascotas/img/fondo-veterinaria.png' %}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .contenido-inicio {
            background-color: rgba(255, 255, 255, 0.50);
            border-radius: 20px;
            padding: 15px;
            max-width: 650px;

            margin: 0 auto;
            position: relative;
            top: 250px;
        }

        .btn-lgt {
            background-color: #FF8A9A;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-lgt:hover {
            background-color: #f46f84;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 138, 154, 0.3);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="contenido-inicio text-center ">

            <div class="mt-4">

                <a href="/registrar/" class="btn btn-success btn-lg m-2">
                    + Registrar mascota
                </a>

                <a href="/mascotas/" class="btn btn-primary btn-lg m-2">
                    Ver mascotas
                </a>

            </div>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-lgt mt-4">Cerrar sesión</button>
            </form>

        </div>
    </div>

</body>

</html>
