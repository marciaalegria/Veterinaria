
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Inicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="text-center mb-5">
            <h1 class="text-primary">Sistema Veterinaria</h1>
            <p class="lead">Gestión de mascotas</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Registrar mascota</h5>
                        <p>Ingresar una nueva mascota.</p>
                        <a href="/registrar/" class="btn btn-primary">
                            Registrar
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Listar mascotas</h5>
                        <p>Consultar las mascotas registradas.</p>
                        <a href="/mascotas/" class="btn btn-success">
                            Ver mascotas
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
